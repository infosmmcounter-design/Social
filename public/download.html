<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download SocialsFlip for laptop</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 560px;
        margin: 48px auto;
        padding: 0 20px;
        background: #faf7ef;
        color: #0a0a0a;
      }
      a.btn {
        display: inline-block;
        background: #111;
        color: #f6e08a;
        padding: 12px 18px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 700;
      }
      code {
        background: #f3ebd2;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>SocialsFlip — laptop preview</h1>
    <p>Download the project ZIP, then run locally:</p>
    <p><a class="btn" href="/SocialsFlip-laptop-preview.zip">Download ZIP</a></p>
    <pre>
unzip SocialsFlip-laptop-preview.zip -d socialsflip
cd socialsflip
npm install
npm run dev
    </pre>
    <p>Open <code>http://localhost:3000</code></p>
  </body>
</html>
